# Flux applies the staging overlay from this repository. `flux bootstrap`
# creates ./flux-system next to this file.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mai
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  path: ./deploy/k8s/staging
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
