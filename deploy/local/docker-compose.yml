# multi.ai.inbox on a single Hetzner server.
# Public ports: 25 (SMTP in) and 443 (API + MCP through Caddy). Nothing else.
# Usage: cp deploy/.env.example deploy/.env && docker compose -f deploy/docker-compose.yml up -d

name: mai

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      MAI_APP_PASSWORD: ${MAI_APP_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-mai.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mai"]
      interval: 5s
      retries: 10

  mai:
    build: ..
    image: ghcr.io/bertodrew/multi-ai-inbox:${MAI_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Non superuser role: row level security only applies to it.
      DATABASE_URL: postgres://mai_app:${MAI_APP_PASSWORD}@postgres:5432/mai?sslmode=disable
      MAI_HOSTNAME: ${MAI_HOSTNAME:?set in .env}
      MAI_SHARED_DOMAIN: ${MAI_SHARED_DOMAIN:?set in .env}
      MAI_SMTP_RELAY: ${MAI_SMTP_RELAY:-}
      MAI_RSPAMD_URL: http://rspamd:11333
    ports:
      - "25:2525"
    volumes:
      - blobs:/var/lib/mai/blobs

  rspamd:
    image: rspamd/rspamd:3.13
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MAI_API_HOST: ${MAI_API_HOST:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  pgdata:
  blobs:
  caddy:
