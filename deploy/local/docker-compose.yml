# multi.ai.inbox for local development (production runs on k3s, see deploy/k8s).
# Public ports: 25 (SMTP in) and 443 (API + MCP through Caddy). Nothing else.
# Usage: cp deploy/local/.env.example deploy/local/.env && docker compose -f deploy/local/docker-compose.yml up -d

name: mai

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      MAI_OWNER_PASSWORD: ${MAI_OWNER_PASSWORD:?set in .env}
      MAI_APP_PASSWORD: ${MAI_APP_PASSWORD:?set in .env}
      MAI_SYSTEM_PASSWORD: ${MAI_SYSTEM_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Same role setup as production (deploy/k8s/base).
      - ../k8s/base/postgres-init.sh:/docker-entrypoint-initdb.d/10-mai.sh:ro
      - ../k8s/base/postgres-roles.sql:/docker-entrypoint-initdb.d/mai-roles.psql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mai"]
      interval: 5s
      retries: 10

  # Schema migrations with the owner role; the platform never gets its password.
  migrate:
    build: ../..
    image: ghcr.io/bertodrew/multi-ai-inbox:${MAI_VERSION:-latest}
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MAI_MIGRATE_DATABASE_URL: postgres://mai_owner:${MAI_OWNER_PASSWORD}@postgres:5432/mai?sslmode=disable

  mai:
    build: ../..
    image: ghcr.io/bertodrew/multi-ai-inbox:${MAI_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # Non superuser roles without BYPASSRLS: row level security always applies.
      # mai_app serves tenant requests; mai_system is the only role whose
      # app.system setting (cross tenant access for workers) is honoured.
      DATABASE_URL: postgres://mai_app:${MAI_APP_PASSWORD}@postgres:5432/mai?sslmode=disable
      MAI_SYSTEM_DATABASE_URL: postgres://mai_system:${MAI_SYSTEM_PASSWORD}@postgres:5432/mai?sslmode=disable
      MAI_HOSTNAME: ${MAI_HOSTNAME:?set in .env}
      MAI_SHARED_DOMAIN: ${MAI_SHARED_DOMAIN:?set in .env}
      MAI_SMTP_RELAY: ${MAI_SMTP_RELAY:-}
      MAI_RSPAMD_URL: http://rspamd:11333
    ports:
      - "25:2525"
    volumes:
      - blobs:/var/lib/mai/blobs

  rspamd:
    image: rspamd/rspamd:4.2.3
    restart: unless-stopped

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MAI_API_HOST: ${MAI_API_HOST:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  pgdata:
  blobs:
  caddy:
