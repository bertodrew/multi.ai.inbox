# Staging on the Hetzner CX33. The image tag below is updated by CI on every
# push to master; Flux applies this directory (GitOps).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mai
resources:
  - ../base
configMapGenerator:
  - name: mai-config
    literals:
      # sslip.io gives a real hostname (and a Let's Encrypt certificate) for
      # the server IP until the brand domain is bought.
      - MAI_API_HOST=api.162-55-213-24.sslip.io
      - MAI_SITE_HOST=162-55-213-24.sslip.io
      - MAI_HOSTNAME=mx.162-55-213-24.sslip.io
      # Local only for now (founder decision): agent to agent mail works,
      # mail from the internet needs the brand domain.
      - MAI_SHARED_DOMAIN=agents.localhost
      - MAI_SPF_INCLUDE=spf.brevo.com
      - MAI_RATE_LIMIT_PER_SECOND=20
      # Blobs stay on the mai-blobs volume (MAI_BLOB_BACKEND=fs); the
      # commented MAI_S3_* env in base/mai.yaml switches to Object Storage.
      # Browser origins allowed to call the API (the future console).
      - MAI_CORS_ORIGINS=https://162-55-213-24.sslip.io
  # Billing stays off until the founder provides the Stripe keys (see
  # docs/billing-enable.md). Uncomment this generator and fill the six real
  # price ids to make the paid plans buyable; the keys go in mai-secrets.
  # - name: mai-billing
  #   literals:
  #     - MAI_BILLING_RETURN_URL=https://162-55-213-24.sslip.io/billing
  #     - MAI_STRIPE_PRICE_BUILDER_MONTHLY=price_...
  #     - MAI_STRIPE_PRICE_BUILDER_YEARLY=price_...
  #     - MAI_STRIPE_PRICE_GROWTH_MONTHLY=price_...
  #     - MAI_STRIPE_PRICE_GROWTH_YEARLY=price_...
  #     - MAI_STRIPE_PRICE_TEAM_MONTHLY=price_...
  #     - MAI_STRIPE_PRICE_TEAM_YEARLY=price_...
images:
  - name: ghcr.io/bertodrew/multi-ai-inbox
    newTag: ed2b5030f5178d8693e812566946879e2c9a3a24
  - name: ghcr.io/bertodrew/multi-ai-inbox-landing
    newTag: ed2b5030f5178d8693e812566946879e2c9a3a24
