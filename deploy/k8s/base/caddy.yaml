# TLS termination with automatic Let's Encrypt certificates for the API host,
# plus the static landing page (baked into the image, see deploy/landing).
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy
data:
  Caddyfile: |
    {
      # Unprivileged ports: the Service maps 80 and 443 to these.
      http_port 8080
      https_port 8443
    }
    {$MAI_API_HOST} {
      # API responses are JSON only: no framing, no sniffing, and HSTS belongs
      # here rather than in the Go gateway, which also answers plain HTTP
      # in-cluster where the header would be meaningless.
      header {
        Strict-Transport-Security "max-age=31536000; includeSubDomains"
        X-Content-Type-Options "nosniff"
        X-Frame-Options "DENY"
        Referrer-Policy "no-referrer"
        Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
        Cross-Origin-Opener-Policy "same-origin"
        -Server
      }
      # Server Sent Events: no compression and no buffering, every event is
      # flushed to the client as soon as the platform writes it.
      @events path /v0/events/stream
      handle @events {
        reverse_proxy mai-http:8080 {
          flush_interval -1
        }
      }
      handle {
        encode zstd gzip
        reverse_proxy mai-http:8080
      }
    }
    # The static export (web/, Next.js) sends no third party requests: styles,
    # fonts and images are all same-origin. 'unsafe-inline' is granted to
    # script-src only because the export inlines its own hydration payload
    # (self.__next_f / TURBOPACK bootstrap), whose hashes change on every
    # build; a hash or nonce needs a header-injecting server, not a file
    # server. Everything else stays 'self'.
    (site_headers) {
      header {
        Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'"
        X-Content-Type-Options "nosniff"
        X-Frame-Options "DENY"
        Referrer-Policy "strict-origin-when-cross-origin"
        Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
        -Server
      }
    }
    (static_site) {
      import site_headers
      encode zstd gzip
      # The console is served from this origin and calls the API from the same
      # origin, so the strict connect-src 'self' policy holds and no CORS
      # preflight is needed. The api.<host> name keeps working for API clients.
      @sse path /v0/events/stream /v1/events/stream
      handle @sse {
        reverse_proxy mai-http:8080 {
          flush_interval -1
        }
      }
      handle /v0/* {
        reverse_proxy mai-http:8080
      }
      handle /v1/* {
        reverse_proxy mai-http:8080
      }
      handle /mcp* {
        reverse_proxy mai-http:8080
      }
      handle /openapi.yaml {
        reverse_proxy mai-http:8080
      }
      root * /srv
      @markdown path *.md /llms.txt
      header @markdown Content-Type "text/markdown; charset=utf-8"
      # Go's mime table has no entry for .webmanifest, and a manifest served as
      # text/plain is not installable in every browser.
      @manifest path /manifest.webmanifest
      header @manifest Content-Type "application/manifest+json; charset=utf-8"
      # The worker script is fetched on every load; never let a proxy hold it.
      @worker path /sw.js
      header @worker Content-Type "text/javascript; charset=utf-8"
      header @worker Cache-Control "no-cache"
      try_files {path} {path}/index.html {path}.html
      file_server
      handle_errors {
        rewrite * /404.html
        file_server
      }
    }
    {$MAI_SITE_HOST} {
      import static_site
      # TLS only; the plain HTTP :8080 site at the bottom must not send this.
      header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    }
    # Certificate for the MX host name only: the SMTP edge reads it for STARTTLS.
    {$MAI_HOSTNAME} {
      respond "multi.ai.inbox mail host" 200
    }
    # Plain HTTP on the raw IP shows the landing too.
    :8080 {
      import static_site
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: caddy }
  template:
    metadata:
      labels: { app: caddy }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      # Nothing here talks to the API server: no token to steal.
      automountServiceAccountToken: false
      # Same user as the platform, so the SMTP edge can read the certificates.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: caddy
          image: landing
          env:
            - name: MAI_API_HOST
              valueFrom: { configMapKeyRef: { name: mai-config, key: MAI_API_HOST } }
            - name: MAI_SITE_HOST
              valueFrom: { configMapKeyRef: { name: mai-config, key: MAI_SITE_HOST } }
            - name: MAI_HOSTNAME
              valueFrom: { configMapKeyRef: { name: mai-config, key: MAI_HOSTNAME } }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: https, containerPort: 8443 }
          securityContext:
            allowPrivilegeEscalation: false
            # Official caddy binary ships file caps (net_bind_service); exec fails with EPERM
            # under drop:["ALL"] unless the cap is granted back to the container.
            capabilities: { drop: ["ALL"], add: ["NET_BIND_SERVICE"] }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/caddy }
            - { name: data, mountPath: /data }
            - { name: runtime, mountPath: /config }
      volumes:
        - name: config
          configMap: { name: caddy }
        - name: runtime
          emptyDir: {}
        - name: data
          persistentVolumeClaim: { claimName: caddy-data }
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
spec:
  type: LoadBalancer
  selector: { app: caddy }
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: https, port: 443, targetPort: https }
