# TLS termination with automatic Let's Encrypt certificates for the API host,
# plus the static landing page (baked into the image, see deploy/landing).
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy
data:
  Caddyfile: |
    {$MAI_API_HOST} {
      encode zstd gzip
      reverse_proxy mai-http:8080
    }
    {$MAI_SITE_HOST} {
      encode zstd gzip
      root * /srv
      try_files {path} {path}.html {path}/index.html /index.html
      file_server
    }
    # Plain HTTP on the raw IP shows the landing too.
    :80 {
      root * /srv
      try_files {path} {path}.html {path}/index.html /index.html
      file_server
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: caddy }
  template:
    metadata:
      labels: { app: caddy }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: caddy
          image: landing
          env:
            - name: MAI_API_HOST
              valueFrom: { configMapKeyRef: { name: mai-config, key: MAI_API_HOST } }
            - name: MAI_SITE_HOST
              valueFrom: { configMapKeyRef: { name: mai-config, key: MAI_SITE_HOST } }
          ports:
            - { name: http, containerPort: 80 }
            - { name: https, containerPort: 443 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/caddy }
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap: { name: caddy }
        - name: data
          persistentVolumeClaim: { claimName: caddy-data }
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
spec:
  type: LoadBalancer
  selector: { app: caddy }
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: https, port: 443, targetPort: https }
