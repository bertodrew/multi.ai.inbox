# Only the platform and the backup job may talk to Postgres; rspamd only
# serves the platform.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-clients
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: mai } }
        - podSelector: { matchLabels: { app: backup } }
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rspamd-clients
spec:
  podSelector:
    matchLabels: { app: rspamd }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: mai } }
      ports:
        - port: 11333
