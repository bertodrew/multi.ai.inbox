apiVersion: v1
kind: Service
metadata:
  name: rspamd
spec:
  selector: { app: rspamd }
  ports:
    - port: 11333
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rspamd
spec:
  replicas: 1
  selector:
    matchLabels: { app: rspamd }
  template:
    metadata:
      labels: { app: rspamd }
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: rspamd
          image: rspamd/rspamd:4.2.3
          ports:
            - containerPort: 11333
          readinessProbe:
            tcpSocket: { port: 11333 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            # The image starts as root and drops to _rspamd itself; the
            # capability drop cannot be added without breaking that switch.
            allowPrivilegeEscalation: false
