# PROPOSAL (not wired into deploy/k8s). Drop in replacement for
# deploy/k8s/base/backup.yaml. Differences from the current job:
#   * every 6 hours instead of nightly (RPO 6h); timestamped dump names
#   * the dump is validated (pg_restore --list, minimum size) before upload
#   * blobs use `rclone copy` instead of `rclone sync`: blobs are write once,
#     so a deletion or corruption on the server never propagates to the backup
#   * caddy-data (Let's Encrypt account and certificates) is copied too, so a
#     rebuild does not need fresh issuance (rate limits)
#   * a dead man's switch is pinged on start, success and failure
#     (healthchecks.io style URL in mai-backup key HC_BACKUP_URL, optional)
#   * retention 14 days for 6 hourly dumps (about 56 dumps)
# Object lock on the bucket (see docs/agentmail-re/14-disaster-recovery-backup.md)
# must use a retention not longer than the delete age below, or the delete fails.
# NOT TESTED against the cluster.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
spec:
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels: { app: backup }
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: dump
              image: postgres:16-alpine
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  f=/work/mai-$(date -u +%Y-%m-%dT%H%MZ).dump
                  pg_dump -h postgres -U postgres -d mai -Fc -Z 6 -f "$f"
                  pg_restore --list "$f" > /dev/null
                  size=$(stat -c %s "$f")
                  [ "$size" -gt 10240 ] || { echo "dump too small: $size bytes"; exit 1; }
                  psql -h postgres -U postgres -d mai -AtXc "select 'organizations', count(*) from organizations union all select 'messages', count(*) from messages union all select 'attachments', count(*) from attachments" > "$f.counts"
                  echo "dump $f $size bytes"
              env:
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: mai-secrets, key: POSTGRES_PASSWORD } }
              volumeMounts:
                - { name: work, mountPath: /work }
          containers:
            - name: upload
              image: rclone/rclone:1.75.2
              command: ["/bin/sh", "-c"]
              args:
                - |
                  # rclone copyurl does a plain GET, enough for a healthchecks.io ping.
                  ping() { [ -n "${HC_BACKUP_URL:-}" ] && rclone copyurl "$HC_BACKUP_URL$1" /tmp/hc.out >/dev/null 2>&1 || true; }
                  ping /start
                  if rclone copy /work "store:$BACKUP_S3_BUCKET/postgres" &&
                     rclone copy /blobs "store:$BACKUP_S3_BUCKET/blobs" &&
                     rclone copy /caddy "store:$BACKUP_S3_BUCKET/caddy-data" &&
                     rclone delete --min-age 14d --include "mai-*" "store:$BACKUP_S3_BUCKET/postgres"; then
                    ping ""
                  else
                    ping /fail; exit 1
                  fi
              env:
                - { name: RCLONE_CONFIG_STORE_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_STORE_PROVIDER, value: Other }
                - name: RCLONE_CONFIG_STORE_ENDPOINT
                  valueFrom: { secretKeyRef: { name: mai-backup, key: BACKUP_S3_ENDPOINT } }
                - name: RCLONE_CONFIG_STORE_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: mai-backup, key: BACKUP_S3_ACCESS_KEY } }
                - name: RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: mai-backup, key: BACKUP_S3_SECRET_KEY } }
                - name: BACKUP_S3_BUCKET
                  valueFrom: { secretKeyRef: { name: mai-backup, key: BACKUP_S3_BUCKET } }
                - name: HC_BACKUP_URL
                  valueFrom: { secretKeyRef: { name: mai-backup, key: HC_BACKUP_URL, optional: true } }
              volumeMounts:
                - { name: work, mountPath: /work }
                - { name: blobs, mountPath: /blobs, readOnly: true }
                - { name: caddy, mountPath: /caddy, readOnly: true }
          volumes:
            - name: work
              emptyDir: {}
            - name: blobs
              persistentVolumeClaim: { claimName: mai-blobs }
            - name: caddy
              persistentVolumeClaim: { claimName: caddy-data }
