# PROPOSAL (not wired into deploy/k8s). Monthly restore drill.
#
# Restores the newest pg_dump from Object Storage into a throwaway Postgres
# that lives only inside this pod (emptyDir, localhost), runs integrity
# queries, checks that a sample of blobs referenced by the restored rows exist
# in the blob backup, and only then pings a dead man's switch
# (healthchecks.io style). Any failure stops the chain, so the success ping is
# never sent and the monitor alerts. It never touches the production database.
#
# Needs in secret mai-backup (same keys as the nightly backup, plus one):
#   BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET, BACKUP_S3_ACCESS_KEY, BACKUP_S3_SECRET_KEY
#   HC_RESTORE_DRILL_URL  (optional; e.g. https://hc-ping.com/<uuid>)
# Tunables: MAX_DUMP_AGE_HOURS, BLOB_SAMPLE, MIN_ORGS (env below).
#
# NOT TESTED against the cluster. Run once by hand after applying:
#   kubectl -n mai create job --from=cronjob/restore-drill restore-drill-manual-$(date +%s)
#   kubectl -n mai logs -f job/<name> --all-containers
# If backups are later encrypted (age), add a decrypt step after fetch.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restore-drill
  labels: { dr.proposal: restore-drill }
spec:
  # 04:43 on the 3rd of every month (after the 02:17 nightly backup).
  # Move to weekly ("43 4 * * 1") once there are paying customers.
  schedule: "43 4 3 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels: { app: restore-drill }
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70        # postgres user in the alpine image
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            # 1. Fetch the newest dump, refuse if it is too old or tiny.
            - name: fetch
              image: rclone/rclone:1.75.2
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  latest=$(rclone lsf --files-only "store:$BACKUP_S3_BUCKET/postgres" | grep '\.dump$' | sort | tail -n 1)
                  [ -n "$latest" ] || { echo "FAIL: no dump found"; exit 1; }
                  echo "latest dump: $latest"
                  rclone copyto "store:$BACKUP_S3_BUCKET/postgres/$latest" /work/latest.dump
                  size=$(stat -c %s /work/latest.dump)
                  [ "$size" -gt 10240 ] || { echo "FAIL: dump is only $size bytes"; exit 1; }
                  # Dump names are mai-YYYY-MM-DD.dump: check the age from the name.
                  day=$(echo "$latest" | sed -E 's/^mai-([0-9]{4}-[0-9]{2}-[0-9]{2}).*/\1/')
                  age_h=$(( ( $(date +%s) - $(date -d "$day 00:00" +%s) ) / 3600 ))
                  [ "$age_h" -le "$MAX_DUMP_AGE_HOURS" ] || { echo "FAIL: newest dump is ${age_h}h old"; exit 1; }
                  echo "$latest $size $age_h" > /work/dump.meta
                  echo "OK fetch: $latest, $size bytes, ${age_h}h old"
              env:
                - { name: MAX_DUMP_AGE_HOURS, value: "48" }
                - { name: HOME, value: /work }
                - { name: XDG_CACHE_HOME, value: /work/.cache }
                - { name: RCLONE_CONFIG, value: /work/rclone.conf }
                - { name: RCLONE_CONFIG_STORE_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_STORE_PROVIDER, value: Other }
                - name: RCLONE_CONFIG_STORE_ENDPOINT
                  valueFrom: { secretKeyRef: { name: mai-backup, key: BACKUP_S3_ENDPOINT } }
                - name: RCLONE_CONFIG_STORE_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: mai-backup, key: BACKUP_S3_ACCESS_KEY } }
                - name: RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: mai-backup, key: BACKUP_S3_SECRET_KEY } }
                - name: BACKUP_S3_BUCKET
                  valueFrom: { secretKeyRef: { name: mai-backup, key: BACKUP_S3_BUCKET } }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - { name: work, mountPath: /work }
            # 2. Restore into a scratch Postgres in this pod and run integrity queries.
            - name: verify-db
              image: postgres:16-alpine
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  export PGDATA=/work/pgdata PGHOST=/work/sock PGUSER=postgres PGDATABASE=mai
                  mkdir -p /work/sock
                  initdb -U postgres --auth=trust -D "$PGDATA" >/dev/null
                  pg_ctl -D "$PGDATA" -o "-c listen_addresses='' -c unix_socket_directories=/work/sock -c fsync=off" -w start >/dev/null
                  psql -v ON_ERROR_STOP=1 -d postgres -qc "create role mai_owner nologin; create role mai_app nologin; create role mai_system nologin"
                  psql -v ON_ERROR_STOP=1 -d postgres -qc "create database mai owner mai_owner"
                  pg_restore --list /work/latest.dump > /dev/null
                  pg_restore --exit-on-error --no-privileges -d mai /work/latest.dump
                  q() { psql -v ON_ERROR_STOP=1 -AtXc "$1"; }
                  fail() { echo "FAIL: $*"; exit 1; }
                  echo "row counts:"
                  for t in organizations api_keys domains inboxes threads messages attachments webhooks events webhook_deliveries audit_log schema_migrations; do
                    echo "  $t $(q "select count(*) from $t")"
                  done
                  [ "$(q 'select count(*) from schema_migrations')" -ge 3 ] || fail "schema_migrations has fewer than 3 rows"
                  [ "$(q 'select count(*) from organizations')" -ge "$MIN_ORGS" ] || fail "fewer than $MIN_ORGS organizations"
                  [ "$(q "select count(*) from messages where raw_key is null and direction = 'in'")" -eq 0 ] || fail "inbound messages without raw_key"
                  [ "$(q 'select count(*) from messages m left join threads t on t.id = m.thread_id where t.id is null')" -eq 0 ] || fail "messages without thread"
                  [ "$(q 'select count(*) from inboxes i left join domains d on d.id = i.domain_id where d.id is null')" -eq 0 ] || fail "inboxes without domain"
                  [ "$(q "select count(*) from domains where org_id is not null and verified_at is not null and dkim_private_key is null")" -eq 0 ] || fail "verified domains without DKIM key"
                  [ "$(q "select count(*) from pg_policies where policyname = 'tenant_isolation'")" -ge 10 ] || fail "row level security policies missing"
                  [ "$(q "select count(*) from pg_class where relname = 'messages' and relforcerowsecurity")" -eq 1 ] || fail "messages lost FORCE ROW LEVEL SECURITY"
                  echo "newest message: $(q 'select coalesce(max(created_at)::text, $$none$$) from messages')"
                  # Sample of blob keys for the next step.
                  q "(select raw_key from messages where raw_key is not null order by created_at desc limit $BLOB_SAMPLE)
                     union all (select storage_key from attachments order by created_at desc limit $BLOB_SAMPLE)" > /work/blob-keys.txt
                  echo "sampled $(wc -l < /work/blob-keys.txt) blob keys"
                  pg_ctl -D "$PGDATA" -m fast -w stop >/dev/null
                  rm -rf "$PGDATA" /work/latest.dump
                  echo "OK verify-db"
              env:
                - { name: MIN_ORGS, value: "1" }
                - { name: BLOB_SAMPLE, value: "20" }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 200m, memory: 256Mi }
                limits: { memory: 1Gi }
              volumeMounts:
                - { name: work, mountPath: /work }
            # 3. Every sampled blob must exist in the blob backup and be non empty.
            - name: verify-blobs
              image: rclone/rclone:1.75.2
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  missing=0; n=0
                  while IFS= read -r key; do
                    [ -n "$key" ] || continue
                    n=$((n+1))
                    size=$(rclone size --json "store:$BACKUP_S3_BUCKET/blobs/$key" 2>/dev/null | sed -nE 's/.*"bytes":([0-9]+).*/\1/p')
                    if [ -z "$size" ] || [ "$size" -eq 0 ]; then echo "missing blob: $key"; missing=$((missing+1)); fi
                  done < /work/blob-keys.txt
                  [ "$missing" -eq 0 ] || { echo "FAIL: $missing of $n sampled blobs missing"; exit 1; }
                  echo "OK verify-blobs: $n sampled blobs present"
              env:
                - { name: HOME, value: /work }
                - { name: XDG_CACHE_HOME, value: /work/.cache }
                - { name: RCLONE_CONFIG, value: /work/rclone.conf }
                - { name: RCLONE_CONFIG_STORE_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_STORE_PROVIDER, value: Other }
                - name: RCLONE_CONFIG_STORE_ENDPOINT
                  valueFrom: { secretKeyRef: { name: mai-backup, key: BACKUP_S3_ENDPOINT } }
                - name: RCLONE_CONFIG_STORE_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: mai-backup, key: BACKUP_S3_ACCESS_KEY } }
                - name: RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: mai-backup, key: BACKUP_S3_SECRET_KEY } }
                - name: BACKUP_S3_BUCKET
                  valueFrom: { secretKeyRef: { name: mai-backup, key: BACKUP_S3_BUCKET } }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - { name: work, mountPath: /work }
          containers:
            # 4. Only reached when every step above succeeded.
            - name: report
              image: curlimages/curl:8.11.1
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  echo "restore drill passed: $(cat /work/dump.meta)"
                  if [ -n "${HC_RESTORE_DRILL_URL:-}" ]; then
                    curl -fsS -m 10 --retry 5 --data-raw "$(cat /work/dump.meta)" "$HC_RESTORE_DRILL_URL" >/dev/null
                    echo "dead man's switch pinged"
                  else
                    echo "WARN: HC_RESTORE_DRILL_URL not set, nobody is alerted when this drill stops passing"
                  fi
              env:
                - name: HC_RESTORE_DRILL_URL
                  valueFrom: { secretKeyRef: { name: mai-backup, key: HC_RESTORE_DRILL_URL, optional: true } }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { memory: 64Mi }
              volumeMounts:
                - { name: work, mountPath: /work }
          volumes:
            - name: work
              emptyDir: { sizeLimit: 30Gi }
