# GitOps release: on master, build and push the image, then pin its tag in
# deploy/k8s/staging. Flux on the server sees the commit and rolls it out.
name: release

on:
  push:
    branches: [master]
    paths-ignore:
      - "deploy/k8s/staging/kustomization.yaml"
      - "docs/**"
      - "**.md"

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ghcr.io/bertodrew/multi-ai-inbox:${{ github.sha }}
            ghcr.io/bertodrew/multi-ai-inbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push landing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/landing/Dockerfile
          push: true
          tags: |
            ghcr.io/bertodrew/multi-ai-inbox-landing:${{ github.sha }}
            ghcr.io/bertodrew/multi-ai-inbox-landing:latest

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin the image tag for Flux
        run: |
          sed -i "s|^    newTag: .*|    newTag: ${GITHUB_SHA}|" deploy/k8s/staging/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/staging/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore(deploy): staging image ${GITHUB_SHA::7}"
          git push
