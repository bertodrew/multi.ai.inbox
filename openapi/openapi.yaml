openapi: 3.1.0
info:
  title: multi.ai.inbox API
  version: 0.1.0
  description: |
    Email inboxes for AI agents, hosted in the EU. Resource names, paths and
    fields follow the shape of the market leader so agents can switch by
    changing base URL and key. The same operations are available as MCP tools
    at POST /mcp (header X-Api-Key or Authorization: Bearer).

    Screen before notify (organization setting `screen_before_notify`, on by
    default): inbound mail is held until the gatekeeper verdict exists.
    `message.received` fires only for a clean verdict, or when a key with
    `message_release` releases a message held for review. Held messages are
    left out of every list and get; `include_review=true` (needs
    `message_review`) adds those held for review. Messages still pending
    screening are never returned. `message_release` is never implied by a
    full access key: only keys that list it hold it, and the first one is
    issued by the operator (`mai admin key-create -permissions ...`).
servers:
  - url: https://api.example.eu
security:
  - bearer: []
paths:
  /v0/auth/me:
    get:
      summary: Organization of the API key
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Org" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /v0/inboxes:
    post:
      summary: Create an inbox (repeat client_id to get the same inbox)
      description: |
        409 already_exists when the address is taken, 409 address_quarantined
        when it belonged to an inbox deleted less than 90 days ago.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInbox" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Inbox" } } } }
        "200": { description: Existing inbox for this client_id, content: { application/json: { schema: { $ref: "#/components/schemas/Inbox" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      summary: List inboxes, newest first
      parameters: [{ $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/page_token" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/InboxList" } } } }
  /v0/inboxes/{inbox}:
    parameters: [{ $ref: "#/components/parameters/inbox" }]
    get:
      summary: Get an inbox
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Inbox" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Update display name
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { display_name: { type: string, maxLength: 200 } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Inbox" } } } }
    delete:
      summary: Delete an inbox and all its mail
      description: |
        Removes the inbox, its threads, messages and attachments. Raw .eml
        files and attachment blobs are queued for deletion in the same
        transaction and removed from storage by the scheduler within minutes.
        The address is quarantined for 90 days: no organization can create
        it again in that window (409 address_quarantined).
      responses: { "204": { description: Deleted }, "404": { $ref: "#/components/responses/Error" } }
  /v0/inboxes/{inbox}/threads:
    parameters: [{ $ref: "#/components/parameters/inbox" }]
    get:
      summary: List threads of an inbox
      parameters: [{ $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/page_token" }, { $ref: "#/components/parameters/label" }, { $ref: "#/components/parameters/include_review" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ThreadList" } } } }
  /v0/threads:
    get:
      summary: List threads across the organization
      parameters: [{ $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/page_token" }, { $ref: "#/components/parameters/label" }, { $ref: "#/components/parameters/include_review" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ThreadList" } } } }
  /v0/threads/{thread}:
    parameters: [{ name: thread, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Get a thread with the messages the caller may see, oldest first
      parameters: [{ $ref: "#/components/parameters/include_review" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Thread" } } } }
  /v0/inboxes/{inbox}/messages:
    parameters: [{ $ref: "#/components/parameters/inbox" }]
    get:
      summary: List message metadata (no bodies)
      parameters: [{ $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/page_token" }, { $ref: "#/components/parameters/label" }, { $ref: "#/components/parameters/include_review" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MessageList" } } } }
  /v0/inboxes/{inbox}/messages/send:
    parameters: [{ $ref: "#/components/parameters/inbox" }, { $ref: "#/components/parameters/idempotency_key" }]
    post:
      summary: Send a new message (new thread)
      description: |
        403 sending_paused when the bounce breaker paused the inbox or the
        organization (hard bounce rate above 5% over at least 20 sends in 24
        hours). Queued mail is held, not sent, until an operator resumes.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Send" }
      responses:
        "200": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/SendResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v0/inboxes/{inbox}/messages/{message}:
    parameters: [{ $ref: "#/components/parameters/inbox" }, { $ref: "#/components/parameters/message" }]
    get:
      summary: Get a message with bodies, extracted_text, authentication results and gatekeeper verdict
      parameters: [{ $ref: "#/components/parameters/include_review" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Add or remove custom labels
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                add_labels: { type: array, items: { type: string } }
                remove_labels: { type: array, items: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
  /v0/inboxes/{inbox}/messages/{message}/raw:
    parameters: [{ $ref: "#/components/parameters/inbox" }, { $ref: "#/components/parameters/message" }]
    get:
      summary: Raw RFC 822 message
      parameters: [{ $ref: "#/components/parameters/include_review" }]
      responses: { "200": { description: OK, content: { message/rfc822: {} } } }
  /v0/inboxes/{inbox}/messages/{message}/reply:
    parameters: [{ $ref: "#/components/parameters/inbox" }, { $ref: "#/components/parameters/message" }, { $ref: "#/components/parameters/idempotency_key" }]
    post:
      summary: Reply in the same thread
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reply" }
      responses:
        "200": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/SendResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /v0/inboxes/{inbox}/messages/{message}/release:
    parameters: [{ $ref: "#/components/parameters/inbox" }, { $ref: "#/components/parameters/message" }]
    post:
      summary: Release a message held for review (needs message_release, audited)
      description: |
        Marks the message `released`, makes it visible and fires
        `message.received`. Only messages with `screening: review` can be
        released; anything else returns `409 not_held`.
      responses:
        "200": { description: Released, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v0/inboxes/{inbox}/messages/{message}/attachments/{attachment}:
    parameters:
      - { $ref: "#/components/parameters/inbox" }
      - { $ref: "#/components/parameters/message" }
      - { name: attachment, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Download an attachment
      parameters: [{ $ref: "#/components/parameters/include_review" }]
      responses: { "200": { description: Attachment bytes with its content type } }
  /v0/domains:
    post:
      summary: Add a custom domain; returns the DNS records to publish
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [domain], properties: { domain: { type: string } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Domain" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      summary: List own and shared domains
      responses: { "200": { description: OK } }
  /v0/domains/{domain}:
    parameters: [{ name: domain, in: path, required: true, schema: { type: string } }]
    get:
      summary: Get a domain with record status
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Domain" } } } } }
    delete:
      summary: Delete a domain without inboxes
      responses: { "204": { description: Deleted }, "409": { $ref: "#/components/responses/Error" } }
  /v0/domains/{domain}/verify:
    parameters: [{ name: domain, in: path, required: true, schema: { type: string } }]
    post:
      summary: Check DNS now (the scheduler also checks every 5 minutes for 7 days)
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Domain" } } } } }
  /v0/api-keys:
    post:
      summary: Create a key with at most the caller's permissions (key shown once)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 100 }
                permissions: { type: array, items: { $ref: "#/components/schemas/Permission" }, description: "omit to copy the caller's permissions" }
                expires_at: { type: string, format: date-time }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Error" }
    get:
      summary: List active keys (requires api_key_read)
      responses: { "200": { description: OK } }
  /v0/api-keys/{key}:
    delete:
      parameters: [{ name: key, in: path, required: true, schema: { type: string, format: uuid } }]
      summary: Revoke a key immediately (requires api_key_write, no escalation)
      responses: { "204": { description: Revoked } }
  /v0/audit-logs:
    get:
      summary: Security relevant actions of the organization (requires audit_read)
      parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }]
      responses: { "200": { description: OK } }
  /v0/webhooks:
    post:
      summary: Create a webhook (secret is returned once)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, event_types]
              properties:
                url: { type: string, format: uri }
                event_types: { type: array, minItems: 1, items: { $ref: "#/components/schemas/EventType" } }
                inbox_ids: { type: array, maxItems: 10, items: { type: string, format: email } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } }
    get:
      summary: List webhooks
      responses: { "200": { description: OK } }
  /v0/webhooks/{webhook}:
    delete:
      parameters: [{ name: webhook, in: path, required: true, schema: { type: string, format: uuid } }]
      summary: Delete a webhook
      responses: { "204": { description: Deleted } }
  /v0/billing:
    get:
      summary: Plan and Stripe subscription state (requires billing_read)
      description: |
        `status` is `none` until a Checkout completes, then the Stripe
        subscription status. A `past_due` or `unpaid` subscription keeps its
        plan until `grace_period_ends_at` (7 days), then the organization
        moves to free; paying restores the plan. 501 billing_disabled when
        the deployment has no Stripe configuration.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Billing" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /v0/billing/checkout:
    post:
      summary: Start a Stripe Checkout for a paid plan (requires billing_write, audited)
      description: |
        Creates a Checkout Session in subscription mode and returns its `url`;
        send the user there. Stripe Tax adds EU VAT and the customer can enter
        a VAT ID. The plan changes when Stripe confirms the payment through
        the webhook, not when this call returns. 409 already_subscribed when
        a subscription is live: change plans in the portal instead.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Checkout" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BillingSession" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v0/billing/portal:
    post:
      summary: Open the Stripe customer portal (requires billing_write, audited)
      description: Plan and interval changes, payment method, invoices and cancellation. 409 no_billing_account before the first Checkout.
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { return_url: { type: string, format: uri } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BillingSession" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /stripe/webhook:
    post:
      summary: Stripe webhook endpoint (public, Stripe-Signature verified)
      description: |
        Not for API clients: register this URL in the Stripe dashboard. The
        raw body must carry a valid `Stripe-Signature` (HMAC SHA256, at most
        5 minutes old). Handles checkout.session.completed,
        customer.subscription.created, customer.subscription.updated,
        customer.subscription.deleted and invoice.payment_failed; other types
        are acknowledged. Each event id is applied once.
      security: []
      parameters: [{ name: Stripe-Signature, in: header, required: true, schema: { type: string } }]
      responses:
        "200": { description: "Received; outcome is applied, duplicate, stale or ignored" }
        "400": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: "API key, prefix mai_live_" }
  parameters:
    inbox: { name: inbox, in: path, required: true, schema: { type: string, format: email } }
    message: { name: message, in: path, required: true, description: "Message UUID or RFC Message-ID (URL encoded)", schema: { type: string } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    page_token: { name: page_token, in: query, schema: { type: string } }
    label: { name: label, in: query, schema: { type: string } }
    idempotency_key: { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 256 } }
    include_review: { name: include_review, in: query, description: "Also return messages held for security review; needs message_review", schema: { type: boolean, default: false } }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            type: object
            required: [name, code, message]
            properties:
              name: { type: string }
              code:
                type: string
                enum: [missing_authorization, unknown_api_key, validation_error, not_found, already_exists,
                       domain_not_verified, conflict, cannot_delete, limit_exceeded, rate_limit_exceeded,
                       address_quarantined, sending_paused,
                       missing_permission, permission_escalation, api_key_expired, not_held,
                       billing_disabled, billing_provider_error, already_subscribed, no_billing_account,
                       invalid_signature, payload_too_large, internal_error]
              message: { type: string }
  schemas:
    Org:
      type: object
      properties:
        organization_id: { type: string, format: uuid }
        name: { type: string }
        plan: { type: string, enum: [free, builder, growth, team] }
        screen_before_notify: { type: boolean, description: "Hold inbound mail until screened (operator setting: mai admin org-screening)" }
    CreateInbox:
      type: object
      additionalProperties: false
      properties:
        username: { type: string, pattern: "^[a-z0-9]([a-z0-9._-]{0,62}[a-z0-9])?$" }
        domain: { type: string }
        display_name: { type: string, maxLength: 200 }
        client_id: { type: string, pattern: "^[A-Za-z0-9._~-]{1,256}$" }
    Inbox:
      type: object
      properties:
        id: { type: string, format: uuid }
        inbox_id: { type: string, format: email }
        email: { type: string, format: email }
        display_name: { type: string }
        client_id: { type: string }
        sending_paused_at:
          type: string
          format: date-time
          description: Set when the bounce breaker paused sending (hard bounce rate above 5% over at least 20 sends in 24 hours); an operator resumes it.
        sending_paused_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InboxList:
      type: object
      properties: { count: { type: integer }, next_page_token: { type: string }, inboxes: { type: array, items: { $ref: "#/components/schemas/Inbox" } } }
    Thread:
      type: object
      properties:
        thread_id: { type: string, format: uuid }
        inbox_id: { type: string }
        subject: { type: string }
        preview: { type: string }
        labels: { type: array, items: { type: string } }
        message_count: { type: integer }
        timestamp: { type: string, format: date-time }
        messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
    ThreadList:
      type: object
      properties: { count: { type: integer }, next_page_token: { type: string }, threads: { type: array, items: { $ref: "#/components/schemas/Thread" } } }
    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        message_id: { type: string, description: RFC 5322 Message-ID with angle brackets }
        thread_id: { type: string, format: uuid }
        inbox_id: { type: string }
        direction: { type: string, enum: [in, out] }
        from: { type: string }
        to: { type: array, items: { type: string } }
        cc: { type: array, items: { type: string } }
        subject: { type: string }
        text: { type: string }
        html: { type: string }
        extracted_text: { type: string, description: New text without quoted history (set by the gatekeeper) }
        preview: { type: string }
        labels: { type: array, items: { type: string } }
        in_reply_to: { type: string }
        references: { type: array, items: { type: string } }
        status: { type: string, enum: [received, queued, sending, sent, failed] }
        authentication_results: { type: object, description: "dkim, spam_score, spam_action" }
        gatekeeper:
          type: object
          properties:
            status: { type: string, enum: [pending, complete, unavailable, timeout] }
            verdict: { type: string, enum: [clear, review] }
            score: { type: number }
            reasons: { type: array, items: { type: string } }
            model: { type: string }
        screening:
          type: string
          enum: [review, allowed, released]
          description: "Hold state under screen before notify; absent when the message was not held. Pending messages are never returned."
        attachments: { type: array, items: { type: object, properties: { attachment_id: { type: string }, filename: { type: string }, content_type: { type: string }, size: { type: integer } } } }
        created_at: { type: string, format: date-time }
    MessageList:
      type: object
      properties: { count: { type: integer }, next_page_token: { type: string }, messages: { type: array, items: { $ref: "#/components/schemas/Message" } } }
    Attachment:
      type: object
      required: [content]
      properties: { filename: { type: string }, content_type: { type: string }, content: { type: string, contentEncoding: base64 } }
    Send:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to: { type: array, minItems: 1, items: { type: string, format: email } }
        cc: { type: array, items: { type: string, format: email } }
        bcc: { type: array, items: { type: string, format: email } }
        subject: { type: string }
        text: { type: string }
        html: { type: string }
        labels: { type: array, items: { type: string } }
        attachments: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
    Reply:
      type: object
      additionalProperties: false
      properties:
        text: { type: string }
        html: { type: string }
        reply_all: { type: boolean }
        labels: { type: array, items: { type: string } }
        attachments: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
    SendResult:
      type: object
      properties: { message_id: { type: string }, thread_id: { type: string, format: uuid } }
    EventType:
      type: string
      enum: [message.received, message.received.spam, message.sent, message.failed, message.bounced, message.security.completed,
             message.security.review, domain.verified, inbox.sending.paused, inbox.sending.resumed,
             organization.sending.paused, organization.sending.resumed]
    Webhook:
      type: object
      properties:
        webhook_id: { type: string, format: uuid }
        url: { type: string }
        event_types: { type: array, items: { $ref: "#/components/schemas/EventType" } }
        inbox_ids: { type: array, items: { type: string } }
        enabled: { type: boolean }
        secret: { type: string, description: "whsec_..., returned only on create" }
    Domain:
      type: object
      properties:
        domain_id: { type: string, format: uuid }
        domain: { type: string }
        shared: { type: boolean }
        status: { type: string, enum: [pending, verified] }
        records:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [MX, TXT] }
              name: { type: string }
              value: { type: string }
              status: { type: string, enum: [verified, missing] }
        last_checked_at: { type: string, format: date-time }
        verified_at: { type: string, format: date-time }
    Permission:
      type: string
      enum: [inbox_read, inbox_write, message_read, message_send, message_update, domain_read, domain_write,
             webhook_read, webhook_write, api_key_read, api_key_write, audit_read, message_review, message_release,
             billing_read, billing_write]
    Checkout:
      type: object
      additionalProperties: false
      required: [plan]
      properties:
        plan: { type: string, enum: [builder, growth, team] }
        interval: { type: string, enum: [monthly, yearly], default: monthly }
        success_url: { type: string, format: uri, description: "Defaults to the deployment's MAI_BILLING_RETURN_URL" }
        cancel_url: { type: string, format: uri, description: "Defaults to the deployment's MAI_BILLING_RETURN_URL" }
    BillingSession:
      type: object
      properties: { session_id: { type: string }, url: { type: string, format: uri } }
    Billing:
      type: object
      properties:
        plan: { type: string, enum: [free, builder, growth, team] }
        status: { type: string, enum: [none, incomplete, incomplete_expired, trialing, active, past_due, unpaid, canceled, paused] }
        interval: { type: string, enum: [monthly, yearly] }
        current_period_end: { type: string, format: date-time }
        cancel_at_period_end: { type: boolean }
        past_due_since: { type: string, format: date-time }
