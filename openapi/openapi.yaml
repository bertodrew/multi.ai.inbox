openapi: 3.1.0
info:
  title: multi.ai.inbox API
  version: 0.1.0
  description: |
    Email inboxes for AI agents, hosted in the EU. Resource names, paths and
    fields follow the shape of the market leader so agents can switch by
    changing base URL and key. The same operations are available as MCP tools
    at POST /mcp (header X-Api-Key or Authorization: Bearer).

    Screen before notify (organization setting `screen_before_notify`, on by
    default): inbound mail is held until the gatekeeper verdict exists.
    `message.received` fires only for a clean verdict, or when a key with
    `message_release` releases a message held for review. Held messages are
    left out of every list and get; `include_review=true` (needs
    `message_review`) adds those held for review. Messages still pending
    screening are never returned. `message_release` is never implied by a
    full access key: only keys that list it hold it, and the first one is
    issued by the operator (`mai admin key-create -permissions ...`).
servers:
  - url: https://api.example.eu
security:
  - bearer: []
paths:
  /v0/auth/me:
    get:
      summary: Caller summary (kept for older clients; same body as GET /v0/me)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /v0/me:
    get:
      summary: The authenticated caller, a person's session or an API key
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /v0/auth/magic-link:
    post:
      summary: Email a single use sign in link (public)
      description: |
        Answers 202 for a known and an unknown address alike, so the endpoint
        never reveals who has an account. The link expires in 15 minutes and
        works once. A browser form post is redirected back to /login.
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [email], properties: { email: { type: string, format: email }, redirect_after: { type: string, description: "Path on the site, for example /console/" } } }
          application/x-www-form-urlencoded:
            schema: { type: object, properties: { email: { type: string }, redirect_after: { type: string } } }
      responses:
        "202": { description: "Sent (or accepted when the address has no account: same answer)" }
        "303": { description: A form post is redirected back to the login page with sent=1 }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v0/auth/callback:
    get:
      summary: Finish a sign in, with a magic link token or an OAuth code (public)
      description: |
        Called by the link in the email, or by the identity provider. A client
        that asks for `application/json` gets the session in the body; a
        browser is sent to `<site>/login/#access_token=...` with the tokens in
        the fragment (never in a query string, so they stay out of logs) or to
        `<site>/login/?error=<code>`.
      security: []
      parameters:
        - { name: token, in: query, schema: { type: string }, description: Magic link token }
        - { name: code, in: query, schema: { type: string }, description: OAuth authorization code }
        - { name: state, in: query, schema: { type: string }, description: "OAuth state, single use, 10 minutes" }
      responses:
        "200": { description: Session, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "303": { description: "A browser goes to the login page with the session in the fragment, or with ?error=<code>" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v0/auth/oauth/{provider}/start:
    get:
      summary: Start Google or GitHub sign in with PKCE (public)
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, github] } }
        - { name: redirect, in: query, schema: { type: string, enum: ["1"] }, description: "Send the browser to the provider instead of returning JSON" }
        - { name: redirect_after, in: query, schema: { type: string }, description: "Path on the site to return to" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OAuthStart" } } } }
        "302": { description: The browser goes to the provider }
        "400": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /v0/auth/refresh:
    post:
      summary: Rotate a refresh token into a new session (public)
      description: |
        The refresh token is single use: the exchange revokes it and returns a
        new pair. A replayed token answers 401.
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [refresh_token], properties: { refresh_token: { type: string } } }
      responses:
        "200": { description: Session, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /v0/auth/logout:
    post:
      summary: End a session (public)
      description: |
        Revokes the session of the refresh token in the body and of the access
        token in Authorization, when either is sent. Idempotent: 204 either way.
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { refresh_token: { type: string } } }
      responses:
        "204": { description: Ended (also when the token was already invalid) }
        "400": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /v0/inboxes:
    post:
      summary: Create an inbox (repeat client_id to get the same inbox)
      description: |
        409 already_exists when the address is taken, 409 address_quarantined
        when it belonged to an inbox deleted less than 90 days ago.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInbox" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Inbox" } } } }
        "200": { description: Existing inbox for this client_id, content: { application/json: { schema: { $ref: "#/components/schemas/Inbox" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      summary: List inboxes, newest first
      parameters: [{ $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/page_token" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/InboxList" } } } }
  /v0/inboxes/{inbox}:
    parameters: [{ $ref: "#/components/parameters/inbox" }]
    get:
      summary: Get an inbox
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Inbox" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Update display name
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { display_name: { type: string, maxLength: 200 } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Inbox" } } } }
    delete:
      summary: Delete an inbox and all its mail
      description: |
        Removes the inbox, its threads, messages and attachments. Raw .eml
        files and attachment blobs are queued for deletion in the same
        transaction and removed from storage by the scheduler within minutes.
        The address is quarantined for 90 days: no organization can create
        it again in that window (409 address_quarantined).
      responses: { "204": { description: Deleted }, "404": { $ref: "#/components/responses/Error" } }
  /v0/inboxes/{inbox}/threads:
    parameters: [{ $ref: "#/components/parameters/inbox" }]
    get:
      summary: List threads of an inbox
      parameters: [{ $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/page_token" }, { $ref: "#/components/parameters/label" }, { $ref: "#/components/parameters/include_review" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ThreadList" } } } }
  /v0/threads:
    get:
      summary: List threads across the organization
      parameters: [{ $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/page_token" }, { $ref: "#/components/parameters/label" }, { $ref: "#/components/parameters/include_review" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ThreadList" } } } }
  /v0/threads/{thread}:
    parameters: [{ name: thread, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Get a thread with the messages the caller may see, oldest first
      parameters: [{ $ref: "#/components/parameters/include_review" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Thread" } } } }
  /v0/inboxes/{inbox}/messages:
    parameters: [{ $ref: "#/components/parameters/inbox" }]
    get:
      summary: List message metadata (no bodies)
      parameters: [{ $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/page_token" }, { $ref: "#/components/parameters/label" }, { $ref: "#/components/parameters/include_review" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MessageList" } } } }
  /v0/inboxes/{inbox}/messages/send:
    parameters: [{ $ref: "#/components/parameters/inbox" }, { $ref: "#/components/parameters/idempotency_key" }]
    post:
      summary: Send a new message (new thread)
      description: |
        403 sending_paused when the bounce breaker paused the inbox or the
        organization (hard bounce rate above 5% over at least 20 sends in 24
        hours, or spam complaints above 0.1% over at least 1000 sends, or 3
        complaints in 24 hours below that volume). Queued mail is held, not
        sent, until an operator resumes.
        429 limit_exceeded when the plan's daily or monthly send limit is
        reached; 429 rate_limited when the plan's 5 minute burst limit is
        reached (free 10, builder 100, growth 250, team 1,500), with Retry-After in seconds.

        Attachments are scanned for viruses before the message is queued:
        422 attachment_infected when one is infected. When the scanner is
        unavailable the message is queued with the av-unscanned label, or
        refused with 503 antivirus_unavailable if the platform fails closed.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Send" }
      responses:
        "200": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/SendResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v0/inboxes/{inbox}/messages/{message}:
    parameters: [{ $ref: "#/components/parameters/inbox" }, { $ref: "#/components/parameters/message" }]
    get:
      summary: Get a message with bodies, extracted_text, authentication results and gatekeeper verdict
      parameters: [{ $ref: "#/components/parameters/include_review" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Add or remove custom labels
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                add_labels: { type: array, items: { type: string } }
                remove_labels: { type: array, items: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
  /v0/inboxes/{inbox}/messages/{message}/raw:
    parameters: [{ $ref: "#/components/parameters/inbox" }, { $ref: "#/components/parameters/message" }]
    get:
      summary: Raw RFC 822 message
      parameters: [{ $ref: "#/components/parameters/include_review" }]
      responses: { "200": { description: OK, content: { message/rfc822: {} } } }
  /v0/inboxes/{inbox}/messages/{message}/reply:
    parameters: [{ $ref: "#/components/parameters/inbox" }, { $ref: "#/components/parameters/message" }, { $ref: "#/components/parameters/idempotency_key" }]
    post:
      summary: Reply in the same thread
      description: "Attachments are scanned like on send (422 attachment_infected, 503 antivirus_unavailable). Same send limits as a new message: 429 limit_exceeded or rate_limited."
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reply" }
      responses:
        "200": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/SendResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v0/inboxes/{inbox}/messages/{message}/release:
    parameters: [{ $ref: "#/components/parameters/inbox" }, { $ref: "#/components/parameters/message" }]
    post:
      summary: Release a message held for review (needs message_release, audited)
      description: |
        Marks the message `released`, makes it visible and fires
        `message.received`. Only messages with `screening: review` can be
        released; anything else returns `409 not_held`.
      responses:
        "200": { description: Released, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v0/inboxes/{inbox}/messages/{message}/attachments/{attachment}:
    parameters:
      - { $ref: "#/components/parameters/inbox" }
      - { $ref: "#/components/parameters/message" }
      - { name: attachment, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Download an attachment
      parameters: [{ $ref: "#/components/parameters/include_review" }]
      responses: { "200": { description: Attachment bytes with its content type } }
  /v0/inboxes/{inbox}/drafts:
    parameters: [{ $ref: "#/components/parameters/inbox" }]
    post:
      summary: Create a draft (needs message_send)
      description: |
        Recipients and a body are only required to send. With `in_reply_to`
        the draft is a reply: `to`, `subject` and threading default to those
        of the message replied to, and the sent message stays in its thread.
        Messages held by screening cannot be replied to. With `send_at` the
        scheduler sends the draft at that time (checked every minute). Fires
        `draft.created`.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDraft" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Draft" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    get:
      summary: List drafts, newest first (needs message_read)
      parameters: [{ $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/page_token" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DraftList" } } } }
  /v0/inboxes/{inbox}/drafts/{draft}:
    parameters: [{ $ref: "#/components/parameters/inbox" }, { $ref: "#/components/parameters/draft" }]
    get:
      summary: Get a draft (needs message_read)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Draft" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Update a draft (needs message_send)
      description: |
        Replaces the fields present in the body. `send_at` schedules the
        draft, `send_at: null` cancels a scheduled send. Editing a draft whose
        scheduled send failed makes it a plain draft again.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDraft" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Draft" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a draft (needs message_send)
      responses: { "204": { description: Deleted } }
  /v0/inboxes/{inbox}/drafts/{draft}/send:
    parameters: [{ $ref: "#/components/parameters/inbox" }, { $ref: "#/components/parameters/draft" }, { $ref: "#/components/parameters/idempotency_key" }]
    post:
      summary: Send a draft now and delete it (needs message_send)
      description: |
        Same rules as a send: plan limits (429 limit_exceeded), 403
        sending_paused, the free plan footer and Idempotency-Key. A repeated
        key returns the first result although the draft is gone.
      responses:
        "200": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/SendResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v0/events/stream:
    get:
      summary: Live events as Server Sent Events (needs message_read)
      description: |
        Streams the organization's events as `text/event-stream`. Each event
        has `id` (its position, for resuming), `event` (the event type) and
        `data` (the webhook envelope: type, event_type, event_id, created_at,
        data). Payloads are the webhook payloads: events about messages held
        by screening carry no body. Without `Last-Event-ID` the stream starts
        with new events; with it, it continues after that id (EventSource
        sends it on reconnect). A `: ping` comment is sent every 15 seconds
        when idle. Up to 5 open streams per API key (429 too_many_streams);
        a revoked or expired key loses its streams within a minute.
      parameters:
        - { name: types, in: query, description: "Comma separated event types; all when absent", schema: { type: string } }
        - { name: inbox, in: query, description: "Only events of this inbox", schema: { type: string, format: email } }
        - { name: Last-Event-ID, in: header, description: "Resume after this event id", schema: { type: integer, minimum: 0 } }
        - { name: last_event_id, in: query, description: "Same as Last-Event-ID, for clients that cannot set headers", schema: { type: integer, minimum: 0 } }
      responses:
        "200": { description: Event stream, content: { text/event-stream: { schema: { type: string } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v0/domains:
    post:
      summary: Add a custom domain; returns the DNS records to publish
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [domain], properties: { domain: { type: string } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Domain" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      summary: List own and shared domains
      responses: { "200": { description: OK } }
  /v0/domains/{domain}:
    parameters: [{ name: domain, in: path, required: true, schema: { type: string } }]
    get:
      summary: Get a domain with record status
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Domain" } } } } }
    delete:
      summary: Delete a domain without inboxes
      responses: { "204": { description: Deleted }, "409": { $ref: "#/components/responses/Error" } }
  /v0/domains/{domain}/verify:
    parameters: [{ name: domain, in: path, required: true, schema: { type: string } }]
    post:
      summary: Check DNS now (the scheduler also checks every 5 minutes for 7 days)
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Domain" } } } } }
  /v0/api-keys:
    post:
      summary: Create a key with at most the caller's permissions (key shown once)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 100 }
                permissions: { type: array, items: { $ref: "#/components/schemas/Permission" }, description: "omit to copy the caller's permissions" }
                expires_at: { type: string, format: date-time }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Error" }
    get:
      summary: List active keys (requires api_key_read)
      responses: { "200": { description: OK } }
  /v0/api-keys/{key}:
    delete:
      parameters: [{ name: key, in: path, required: true, schema: { type: string, format: uuid } }]
      summary: Revoke a key immediately (requires api_key_write, no escalation)
      responses: { "204": { description: Revoked } }
  /v0/audit-logs:
    get:
      summary: Security relevant actions of the organization (requires audit_read)
      parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }]
      responses: { "200": { description: OK } }
  /v0/webhooks:
    post:
      summary: Create a webhook (secret is returned once)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, event_types]
              properties:
                url: { type: string, format: uri }
                event_types: { type: array, minItems: 1, items: { $ref: "#/components/schemas/EventType" } }
                inbox_ids: { type: array, maxItems: 10, items: { type: string, format: email } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } }
    get:
      summary: List webhooks
      responses: { "200": { description: OK } }
  /v0/webhooks/{webhook}:
    delete:
      parameters: [{ name: webhook, in: path, required: true, schema: { type: string, format: uuid } }]
      summary: Delete a webhook
      responses: { "204": { description: Deleted } }
  /v0/billing:
    get:
      summary: Plan and Stripe subscription state (requires billing_read)
      description: |
        `status` is `none` until a Checkout completes, then the Stripe
        subscription status. A `past_due` or `unpaid` subscription keeps its
        plan until `grace_period_ends_at` (7 days), then the organization
        moves to free; paying restores the plan. 501 billing_disabled when
        the deployment has no Stripe configuration.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Billing" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /v0/billing/checkout:
    post:
      summary: Start a Stripe Checkout for a paid plan (requires billing_write, audited)
      description: |
        Creates a Checkout Session in subscription mode and returns its `url`;
        send the user there. Stripe Tax adds EU VAT and the customer can enter
        a VAT ID. The plan changes when Stripe confirms the payment through
        the webhook, not when this call returns. 409 already_subscribed when
        a subscription is live: change plans in the portal instead.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Checkout" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BillingSession" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v0/billing/portal:
    post:
      summary: Open the Stripe customer portal (requires billing_write, audited)
      description: Plan and interval changes, payment method, invoices and cancellation. 409 no_billing_account before the first Checkout.
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { return_url: { type: string, format: uri } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BillingSession" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v0/export:
    get:
      summary: Export the organization's own data (requires data_export, audited)
      description: |
        Access and portability (Art. 15 and 20 GDPR) in one JSON document:
        organization settings, inboxes, custom domains, webhooks, API key
        metadata, row counts and the security audit log. Mailbox contents are
        not duplicated here — export them in full over IMAP, or one message at
        a time through the `raw` endpoint. Secrets (API key material, webhook
        signing secrets, DKIM private keys) are never exported.
        The response carries `Content-Disposition: attachment`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgExport" }
        "403": { $ref: "#/components/responses/Error" }
  /v0/organization:
    delete:
      summary: Delete the organization and all its data (requires data_delete, audited)
      description: |
        Erasure (Art. 17 GDPR). `confirm` must equal the organization name
        exactly. API keys are revoked first, then the export is returned, then
        the organization row is deleted: inboxes, messages, attachments,
        domains, webhooks, events, drafts and the audit log go with it. Blob
        deletion is asynchronous (scheduler) and deleted addresses stay
        quarantined for 90 days, so they cannot be re-registered by someone
        else. `data_delete` is never implied by a full access key: the operator
        must issue a key that lists it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm: { type: string, description: "The organization name, verbatim" }
      responses:
        "200":
          description: Deleted; body carries the export taken before deletion
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletion: { type: object }
                  export_before_deletion: { $ref: "#/components/schemas/OrgExport" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /stripe/webhook:
    post:
      summary: Stripe webhook endpoint (public, Stripe-Signature verified)
      description: |
        Not for API clients: register this URL in the Stripe dashboard. The
        raw body must carry a valid `Stripe-Signature` (HMAC SHA256, at most
        5 minutes old). Handles checkout.session.completed,
        customer.subscription.created, customer.subscription.updated,
        customer.subscription.deleted and invoice.payment_failed; other types
        are acknowledged. Each event id is applied once.
      security: []
      parameters: [{ name: Stripe-Signature, in: header, required: true, schema: { type: string } }]
      responses:
        "200": { description: "Received; outcome is applied, duplicate, stale or ignored" }
        "400": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: "API key (mai_live_..., for agents) or a session access token (a signed JWT, for people). Both go in Authorization: Bearer" }
  parameters:
    inbox: { name: inbox, in: path, required: true, schema: { type: string, format: email } }
    message: { name: message, in: path, required: true, description: "Message UUID or RFC Message-ID (URL encoded)", schema: { type: string } }
    draft: { name: draft, in: path, required: true, schema: { type: string, format: uuid } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    page_token: { name: page_token, in: query, schema: { type: string } }
    label: { name: label, in: query, schema: { type: string } }
    idempotency_key: { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 256 } }
    include_review: { name: include_review, in: query, description: "Also return messages held for security review; needs message_review", schema: { type: boolean, default: false } }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            type: object
            required: [name, code, message]
            properties:
              name: { type: string }
              code:
                type: string
                enum: [missing_authorization, unknown_api_key, validation_error, not_found, already_exists,
                       domain_not_verified, conflict, cannot_delete, limit_exceeded, rate_limit_exceeded,
                       rate_limited, address_quarantined, sending_paused,
                       missing_permission, permission_escalation, api_key_expired, not_held,
                       billing_disabled, billing_provider_error, already_subscribed, no_billing_account,
                       invalid_signature, too_many_streams, payload_too_large, attachment_infected, antivirus_unavailable,
                       auth_disabled, provider_not_configured, invalid_magic_link, invalid_state, code_rejected,
                       email_not_verified, provider_unavailable, email_delivery_failed, invalid_refresh_token,
                       token_expired, unknown_token, session_revoked, access_denied, internal_error]
              message: { type: string }
  schemas:
    User:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        provider: { type: string, enum: [magic_link, google, github], description: Identity that first proved this address }
        role: { type: string, enum: [owner, admin, member] }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }
    Session:
      type: object
      properties:
        access_token: { type: string, description: "Signed JWT, send as Authorization: Bearer, 15 minutes" }
        refresh_token: { type: string, description: "Single use, 30 days, rotate it at POST /v0/auth/refresh" }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Seconds until the access token expires }
        expires_at: { type: string, format: date-time }
        refresh_expires_at: { type: string, format: date-time }
        role: { type: string, enum: [owner, admin, member] }
        user: { $ref: "#/components/schemas/User" }
        organization: { $ref: "#/components/schemas/Org" }
    OAuthStart:
      type: object
      properties:
        provider: { type: string, enum: [google, github] }
        authorize_url: { type: string, description: "Provider URL, with state and the S256 PKCE challenge" }
        state: { type: string, description: "Single use, 10 minutes" }
        expires_at: { type: string, format: date-time }
    Me:
      type: object
      properties:
        auth: { type: string, enum: [api_key, session] }
        organization_id: { type: string, format: uuid }
        name: { type: string }
        plan: { type: string, enum: [free, builder, growth, team] }
        screen_before_notify: { type: boolean }
        role: { type: string, enum: [owner, admin, member], description: Only for a session }
        api_key_id: { type: string, format: uuid, description: Only for an API key }
        user: { type: object, properties: { user_id: { type: string, format: uuid }, email: { type: string, format: email } }, description: Only for a session }
        organization: { $ref: "#/components/schemas/Org" }
        permissions: { type: array, items: { type: string } }
        expires_at: { type: string, format: date-time }
    Org:
      type: object
      properties:
        organization_id: { type: string, format: uuid }
        name: { type: string }
        plan: { type: string, enum: [free, builder, growth, team] }
        screen_before_notify: { type: boolean, description: "Hold inbound mail until screened (operator setting: mai admin org-screening)" }
    CreateInbox:
      type: object
      additionalProperties: false
      properties:
        username: { type: string, pattern: "^[a-z0-9]([a-z0-9._-]{0,62}[a-z0-9])?$" }
        domain: { type: string }
        display_name: { type: string, maxLength: 200 }
        client_id: { type: string, pattern: "^[A-Za-z0-9._~-]{1,256}$" }
    Inbox:
      type: object
      properties:
        id: { type: string, format: uuid }
        inbox_id: { type: string, format: email }
        email: { type: string, format: email }
        display_name: { type: string }
        client_id: { type: string }
        sending_paused_at:
          type: string
          format: date-time
          description: Set when the bounce breaker paused sending (hard bounce rate above 5% over at least 20 sends in 24 hours); an operator resumes it.
        sending_paused_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InboxList:
      type: object
      properties: { count: { type: integer }, next_page_token: { type: string }, inboxes: { type: array, items: { $ref: "#/components/schemas/Inbox" } } }
    Thread:
      type: object
      properties:
        thread_id: { type: string, format: uuid }
        inbox_id: { type: string }
        subject: { type: string }
        preview: { type: string }
        labels: { type: array, items: { type: string } }
        message_count: { type: integer }
        timestamp: { type: string, format: date-time }
        messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
    ThreadList:
      type: object
      properties: { count: { type: integer }, next_page_token: { type: string }, threads: { type: array, items: { $ref: "#/components/schemas/Thread" } } }
    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        message_id: { type: string, description: RFC 5322 Message-ID with angle brackets }
        thread_id: { type: string, format: uuid }
        inbox_id: { type: string }
        direction: { type: string, enum: [in, out] }
        from: { type: string }
        to: { type: array, items: { type: string } }
        cc: { type: array, items: { type: string } }
        subject: { type: string }
        text: { type: string }
        html: { type: string }
        extracted_text: { type: string, description: New text without quoted history (set by the gatekeeper) }
        preview: { type: string }
        labels: { type: array, items: { type: string } }
        in_reply_to: { type: string }
        references: { type: array, items: { type: string } }
        status: { type: string, enum: [received, queued, sending, sent, failed] }
        authentication_results:
          type: object
          description: "What the SMTP edge verified for inbound mail: dkim, spf, dmarc, dmarc_policy, antivirus, spam_score, spam_action. Mail failing DMARC is labelled dmarc-fail, and spam under p=quarantine or p=reject."
          properties:
            dkim: { type: string, enum: [pass, fail, none], description: "A valid signature aligned with the From domain" }
            spf: { type: string, enum: [pass, fail, softfail, neutral, none, temperror, permerror], description: "RFC 7208 result for the MAIL FROM identity (HELO for a null sender)" }
            dmarc: { type: string, enum: [pass, fail, none, temperror, permerror], description: "RFC 7489 result with relaxed or strict alignment as the record asks" }
            dmarc_policy: { type: string, enum: [none, quarantine, reject], description: "Policy of the From domain after sp= and pct=, when a record exists" }
            antivirus: { type: string, enum: [clean, unscanned] }
            spam_score: { type: number }
            spam_action: { type: string }
            internal: { type: boolean, description: "Delivered between inboxes of this platform" }
        gatekeeper:
          type: object
          properties:
            status: { type: string, enum: [pending, complete, unavailable, timeout] }
            verdict: { type: string, enum: [clear, review] }
            score: { type: number }
            reasons: { type: array, items: { type: string } }
            model: { type: string }
        screening:
          type: string
          enum: [review, allowed, released]
          description: "Hold state under screen before notify; absent when the message was not held. Pending messages are never returned."
        attachments: { type: array, items: { type: object, properties: { attachment_id: { type: string }, filename: { type: string }, content_type: { type: string }, size: { type: integer } } } }
        created_at: { type: string, format: date-time }
    MessageList:
      type: object
      properties: { count: { type: integer }, next_page_token: { type: string }, messages: { type: array, items: { $ref: "#/components/schemas/Message" } } }
    Attachment:
      type: object
      required: [content]
      properties: { filename: { type: string }, content_type: { type: string }, content: { type: string, contentEncoding: base64 } }
    Send:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to: { type: array, minItems: 1, items: { type: string, format: email } }
        cc: { type: array, items: { type: string, format: email } }
        bcc: { type: array, items: { type: string, format: email } }
        subject: { type: string }
        text: { type: string }
        html: { type: string }
        labels: { type: array, items: { type: string } }
        attachments: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
    Reply:
      type: object
      additionalProperties: false
      properties:
        text: { type: string }
        html: { type: string }
        reply_all: { type: boolean }
        labels: { type: array, items: { type: string } }
        attachments: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
    SendResult:
      type: object
      properties: { message_id: { type: string }, thread_id: { type: string, format: uuid } }
    CreateDraft:
      type: object
      additionalProperties: false
      properties:
        to: { type: array, items: { type: string, format: email } }
        cc: { type: array, items: { type: string, format: email } }
        bcc: { type: array, items: { type: string, format: email } }
        subject: { type: string }
        text: { type: string }
        html: { type: string }
        labels: { type: array, items: { type: string } }
        attachments: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
        in_reply_to: { type: string, description: "Message UUID or RFC Message-ID to reply to" }
        reply_all: { type: boolean, description: "With in_reply_to: copy the other recipients" }
        send_at: { type: string, format: date-time, description: "Send automatically at this time (future, within 365 days)" }
    UpdateDraft:
      type: object
      additionalProperties: false
      properties:
        to: { type: array, items: { type: string, format: email } }
        cc: { type: array, items: { type: string, format: email } }
        bcc: { type: array, items: { type: string, format: email } }
        subject: { type: string }
        text: { type: string }
        html: { type: string }
        labels: { type: array, items: { type: string } }
        attachments: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
        send_at: { type: [string, "null"], format: date-time, description: "null cancels a scheduled send" }
    Draft:
      type: object
      properties:
        draft_id: { type: string, format: uuid }
        inbox_id: { type: string, format: email }
        thread_id: { type: string, format: uuid, description: Set for a reply draft }
        in_reply_to: { type: string, description: RFC Message-ID of the message replied to }
        references: { type: array, items: { type: string } }
        to: { type: array, items: { type: string } }
        cc: { type: array, items: { type: string } }
        bcc: { type: array, items: { type: string } }
        subject: { type: string }
        text: { type: string }
        html: { type: string }
        labels: { type: array, items: { type: string } }
        attachments: { type: array, items: { type: object, properties: { filename: { type: string }, content_type: { type: string }, size: { type: integer } } } }
        send_at: { type: string, format: date-time }
        status: { type: string, enum: [draft, scheduled, failed] }
        last_error: { type: string, description: Why a scheduled send was refused }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DraftList:
      type: object
      properties: { count: { type: integer }, next_page_token: { type: string }, drafts: { type: array, items: { $ref: "#/components/schemas/Draft" } } }
    EventType:
      type: string
      enum: [message.received, message.received.spam, message.sent, message.failed, message.bounced, message.complained,
             message.security.completed, message.security.review, domain.verified, draft.created, inbox.sending.paused, inbox.sending.resumed,
             organization.sending.paused, organization.sending.resumed, security.av_unavailable]
    Webhook:
      type: object
      properties:
        webhook_id: { type: string, format: uuid }
        url: { type: string }
        event_types: { type: array, items: { $ref: "#/components/schemas/EventType" } }
        inbox_ids: { type: array, items: { type: string } }
        enabled: { type: boolean }
        secret: { type: string, description: "whsec_..., returned only on create" }
    Domain:
      type: object
      properties:
        domain_id: { type: string, format: uuid }
        domain: { type: string }
        shared: { type: boolean }
        status: { type: string, enum: [pending, verified] }
        records:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [MX, TXT] }
              name: { type: string }
              value: { type: string }
              status: { type: string, enum: [verified, missing] }
        last_checked_at: { type: string, format: date-time }
        verified_at: { type: string, format: date-time }
    Permission:
      type: string
      enum: [inbox_read, inbox_write, message_read, message_send, message_update, domain_read, domain_write,
             webhook_read, webhook_write, api_key_read, api_key_write, audit_read, message_review, message_release,
             billing_read, billing_write, data_export, data_delete]
    Checkout:
      type: object
      additionalProperties: false
      required: [plan]
      properties:
        plan: { type: string, enum: [builder, growth, team] }
        interval: { type: string, enum: [monthly, yearly], default: monthly }
        success_url: { type: string, format: uri, description: "Defaults to the deployment's MAI_BILLING_RETURN_URL" }
        cancel_url: { type: string, format: uri, description: "Defaults to the deployment's MAI_BILLING_RETURN_URL" }
    BillingSession:
      type: object
      properties: { session_id: { type: string }, url: { type: string, format: uri } }
    Billing:
      type: object
      properties:
        plan: { type: string, enum: [free, builder, growth, team] }
        status: { type: string, enum: [none, incomplete, incomplete_expired, trialing, active, past_due, unpaid, canceled, paused] }
        interval: { type: string, enum: [monthly, yearly] }
        current_period_end: { type: string, format: date-time }
        cancel_at_period_end: { type: boolean }
        past_due_since: { type: string, format: date-time }
        grace_period_ends_at: { type: string, format: date-time, description: "Set while past_due or unpaid; the plan drops to free after it" }
    OrgExport:
      type: object
      properties:
        format: { type: string, example: "aimulti.inbox/export@1" }
        generated_at: { type: string, format: date-time }
        organization: { $ref: "#/components/schemas/Org" }
        inboxes:
          type: array
          items:
            type: object
            properties:
              address: { type: string }
              display_name: { type: string }
              client_id: { type: string }
              created_at: { type: string, format: date-time }
              messages: { type: integer }
        domains:
          type: array
          items:
            type: object
            properties:
              domain: { type: string }
              status: { type: string, enum: [verified, pending] }
              created_at: { type: string, format: date-time }
              verified_at: { type: string, format: date-time }
        webhooks:
          type: array
          items:
            type: object
            properties:
              webhook_id: { type: string }
              url: { type: string, format: uri }
              event_types: { type: array, items: { $ref: "#/components/schemas/EventType" } }
              enabled: { type: boolean }
              created_at: { type: string, format: date-time }
        api_keys:
          type: array
          description: Metadata only; the key and its hash are never exported.
          items:
            type: object
            properties:
              api_key_id: { type: string }
              name: { type: string }
              permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } }
              created_at: { type: string, format: date-time }
              expires_at: { type: string, format: date-time }
              last_used_at: { type: string, format: date-time }
              revoked_at: { type: string, format: date-time }
        counts:
          type: object
          additionalProperties: { type: integer }
        audit_log:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              actor: { type: string }
              action: { type: string }
              target: { type: string }
              ip: { type: string }
              request_id: { type: string }
              metadata: { type: object }
              created_at: { type: string, format: date-time }
        notice: { type: string, description: "What this export deliberately leaves out, in plain language" }
