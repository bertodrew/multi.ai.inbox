[package]
name = "gatekeeper"
version = "0.1.0"
edition = "2021"
description = "Inbound email screening for AI agents: prompt injection heuristics and reply extraction"
publish = false

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
